<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FocusForge | CodePixel</title><link rel="stylesheet" href="style.css"></head><body><header>FOCUSFORGE<span>.</span><small>CODEPIXEL LAB / 02</small></header><main><p class="eyebrow">STUDY SYSTEM · LOCAL DEMO</p><h1>Protect your<br><span>focus.</span></h1><p class="muted">Plan tasks, run a focus timer, and track progress.</p><section class="panel timer"><p id="mode" class="eyebrow">FOCUS SESSION</p><div id="clock">25:00</div><button id="start">Start</button> <button id="reset" class="ghost">Reset</button><div class="presets"><button data-min="25" class="ghost">25 min</button><button data-min="15" class="ghost">15 min</button><button data-min="5" class="ghost">5 min break</button></div></section><section class="panel"><h2>Today's tasks</h2><form id="form"><input id="task" required maxlength="100" placeholder="e.g. Practise Java loops"><button>Add task +</button></form><div id="list"></div><p id="progressText" class="muted">0 / 0 complete</p><div class="track"><span id="progress"></span></div></section><footer>HTML · CSS · JavaScript · localStorage</footer></main><script src="app.js"></script></body></html>
